apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: aircraft_configuration
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["engineering_engineer", "engineering_manager", "camo_engineer", "camo_manager", "certifying_staff", "auditor", "quality_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["design", "install"]
      effect: EFFECT_ALLOW
      roles: ["engineering_engineer", "engineering_manager", "camo_engineer", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["engineering_manager", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
