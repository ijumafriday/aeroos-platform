apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: crew_control
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["occ_controller", "crew_planner", "training_manager", "finance_manager", "quality_manager", "auditor"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      roles: ["occ_controller", "crew_planner", "training_manager", "finance_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["crew_planner", "training_manager", "finance_manager", "accountable_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
