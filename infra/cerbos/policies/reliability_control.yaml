apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: reliability_control
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager", "quality_manager", "accountable_manager", "auditor"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["camo_manager", "accountable_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
