apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: analytics_control
  rules:
    - actions: ["read", "run"]
      effect: EFFECT_ALLOW
      roles: ["accountable_manager", "finance_controller", "quality_manager", "camo_manager", "occ_controller", "auditor", "platform_admin"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      roles: ["finance_controller", "quality_manager", "platform_admin"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["accountable_manager", "quality_manager", "platform_admin"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
