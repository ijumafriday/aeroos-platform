# Safety corrective/risk-control actions. Owners complete; the Safety Manager independently verifies.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: safety_action
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["safety_manager", "auditor", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["read", "complete"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager", "certifying_staff", "auditor", "safety_manager", "storekeeper", "occ_controller", "flight_crew"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.operatorId in request.principal.attr.operators
              - expr: request.resource.attr.owner == request.principal.attr.username
    - actions: ["complete", "verify"]
      effect: EFFECT_ALLOW
      roles: ["safety_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
