apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: commercial_control
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["finance_controller", "accountable_manager", "amo_manager", "camo_manager", "quality_manager", "auditor"]
      condition: { match: { expr: "request.resource.attr.operatorId in request.principal.attr.operators" } }
    - actions: ["manage"]
      effect: EFFECT_ALLOW
      roles: ["finance_controller", "amo_manager"]
      condition: { match: { expr: "request.resource.attr.operatorId in request.principal.attr.operators" } }
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["finance_controller", "accountable_manager"]
      condition: { match: { expr: "request.resource.attr.operatorId in request.principal.attr.operators" } }
