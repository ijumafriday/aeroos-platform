# Quality corrective/preventive actions. Owners complete; the Quality Manager independently verifies effectiveness.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: quality_action
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["quality_manager", "auditor", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
    - actions: ["read", "complete"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager", "certifying_staff", "auditor", "quality_manager", "storekeeper", "occ_controller"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.operatorId in request.principal.attr.operators
              - expr: request.resource.attr.owner == request.principal.attr.username
    - actions: ["complete", "verify"]
      effect: EFFECT_ALLOW
      roles: ["quality_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
