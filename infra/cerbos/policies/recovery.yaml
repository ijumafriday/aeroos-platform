# Disruption recovery runs: only OCC controllers start and decide; auditors may review.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: recovery
  rules:
    - actions: ["read", "run", "decide"]
      effect: EFFECT_ALLOW
      roles: ["occ_controller"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators

    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["auditor"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
