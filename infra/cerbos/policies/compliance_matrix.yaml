# Compliance traceability matrix with live evidence counts: quality, auditors and the CAMO manager read it.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: compliance_matrix
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["quality_manager", "auditor", "camo_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
