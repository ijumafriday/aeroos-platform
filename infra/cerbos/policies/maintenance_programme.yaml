# Due list, aircraft status, reliability and tracked components. Compliance is recorded only from AMO CRSs;
# component removals/installations are recorded by CAMO and certifying staff.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: maintenance_programme
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager", "certifying_staff", "occ_controller", "auditor", "quality_manager"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators

    - actions: ["record_component"]
      effect: EFFECT_ALLOW
      roles: ["camo_engineer", "camo_manager", "certifying_staff"]
      condition:
        match:
          expr: request.resource.attr.operatorId in request.principal.attr.operators
