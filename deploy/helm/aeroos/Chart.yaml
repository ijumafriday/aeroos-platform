apiVersion: v2
name: aeroos
description: AeroOS aviation enterprise platform — one chart, two profiles (cloud / self-hosted)
type: application
version: 0.50.0
appVersion: "0.50.0"
dependencies:
  # Self-hosted profile only. In the cloud profile point temporal.address at Temporal Cloud.
  - name: temporal
    repository: https://go.temporal.io/helm-charts
    version: ">=0.50.0"
    condition: temporal.enabled
  - name: cerbos
    repository: https://download.cerbos.dev/helm-charts
    version: ">=0.38.0"
    condition: cerbos.enabled
