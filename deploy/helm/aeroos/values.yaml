# Defaults shared by both profiles. Override with values-cloud.yaml or values-selfhosted.yaml.

image:
  registry: ghcr.io/your-org    # a private registry (e.g. Harbor) for air-gapped sites
  tag: "0.50.0"                 # development/fallback; production should set sha256 digests below
  digests:
    api: ""
    worker: ""
    web: ""
    optimiser: ""
  pullPolicy: IfNotPresent

profile: cloud                  # cloud | self-hosted

publicUrl: https://aeroos.example.com

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }
  seedDemo: false
  allowDraftRulepacks: false
  webauthn:                         # passkeys for CRS confirmation (ADR-0017)
    rpId: ""                        # the web app's domain, e.g. aeroos.example.com
    origins: ""                      # comma-separated exact origins, e.g. https://aeroos.example.com
  defaultOperator: ""               # for users in several operators when the request names none
  movementSimulation: false          # production: actual times come only from MVT/ACARS
  movementKeySecret: aeroos-movement-key   # key MOVEMENT_API_KEYS ("NKX=key,FJR=key"); empty disables the endpoint
  opsProviderKeySecret: ""              # optional secret containing OPS_PROVIDER_API_KEYS
  frmsProviderKeySecret: ""             # optional secret containing FRMS_PROVIDER_API_KEYS
  stepUpMaxAgeSeconds: 300      # re-authentication window before a CRS can be issued
  rateLimit:
    enabled: true
    windowSeconds: 60
    authenticatedRequests: 300
    anonymousRequests: 60

worker:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

optimiser:
  replicas: 1
  timeLimitSeconds: 20          # CP-SAT search limit per run; the greedy plan is always available
  concurrency: 2                # runs solved in parallel per pod (each uses up to 8 search workers)
  resources:
    requests: { cpu: 1000m, memory: 512Mi }
    limits: { memory: 2Gi }

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

ingress:
  enabled: true
  className: nginx
  tls:
    secretName: aeroos-tls

# --- data plane: always reached by open protocol, so managed and self-hosted are interchangeable
postgres:
  host: ""                      # managed endpoint (cloud) or <release>-pg-rw (self-hosted)
  port: 5432
  database: aeroos
  # Secret with keys DB_PASSWORD_AEROOS_OWNER, DB_PASSWORD_PLATFORM_SVC, DB_PASSWORD_COMPLIANCE_SVC,
  # DB_PASSWORD_ORG_SVC, DB_PASSWORD_CAMO_SVC, DB_PASSWORD_ENGINEERING_SVC, DB_PASSWORD_RECORDS_SVC, DB_PASSWORD_AMO_SVC, DB_PASSWORD_OPS_SVC
  passwordsSecret: aeroos-db-passwords

kafka:
  brokers: ""                   # managed bootstrap servers (cloud) or <release>-kafka-kafka-bootstrap:9092
  partitions: 6
  replication: 3

temporal:
  enabled: false                # true deploys the Temporal chart (self-hosted)
  address: ""                   # Temporal Cloud or <release>-temporal-frontend:7233
  namespace: default

cerbos:
  enabled: true
  url: ""                       # defaults to the in-cluster Cerbos service

oidc:
  issuer: ""                    # public issuer URL, e.g. https://id.example.com/realms/aeroos
  jwksUrl: ""                   # in-cluster or public JWKS endpoint
  audience: aeroos-api
  clientId: aeroos-web

signing:
  # transit: OpenBao / HashiCorp Vault Transit (HSM-backed in production) — ADR-0006.
  # local:   key file, development only; refused in production unless allowLocal is true.
  provider: transit
  allowLocal: false
  transit:
    address: ""                 # e.g. https://openbao.security.svc:8200
    mount: transit
    key: aeroos-signing         # an ed25519 key
    tokenSecret: aeroos-transit-token   # key "token"

# S3 protocol: MinIO / Ceph RGW (self-hosted) or any cloud S3.
objectStorage:
  endpoint: ""                  # in-cluster endpoint used by the API
  publicEndpoint: ""            # endpoint browsers use for presigned URLs
  region: us-east-1
  forcePathStyle: true
  documentsBucket: aeroos-documents
  anchorsBucket: aeroos-audit-anchors   # Object Lock (COMPLIANCE) — created with retention below
  anchorRetentionDays: 3650
  credentialsSecret: aeroos-s3-credentials   # keys S3_ACCESS_KEY, S3_SECRET_KEY

observability:
  enabled: true
  otlpEndpoint: http://otel-collector.observability.svc:4318

serviceIdentity:
  tokenUrl: "" # required: internal/reachable OIDC token endpoint
  workerClientId: aeroos-worker
  optimiserClientId: aeroos-optimiser
  secretName: aeroos-service-clients # keys WORKER_CLIENT_SECRET, OPTIMISER_CLIENT_SECRET

# Horizontal scaling is deliberately conservative; raise maxima after load testing against your fleet size.
autoscaling:
  enabled: true
  api: { minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 65 }
  worker: { minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
  web: { minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  optimiser: { minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 75 }

networkPolicy:
  enabled: true
  # Managed Kafka/Postgres/Temporal/Vault/S3 often live outside the cluster. Egress is restricted by port.
  externalCidrs: ["0.0.0.0/0"]
